<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BPFCo Super Brain 3D</title>
<script src="/vendor/3d-force-graph.min.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050a;color:#e8eef4;font:13px Segoe UI,Arial}
#graph{position:fixed;inset:0}
#stars{position:fixed;inset:0;pointer-events:none;background:
radial-gradient(circle at 10% 20%,#fff 0 1px,transparent 1.5px),
radial-gradient(circle at 24% 78%,#fff 0 1px,transparent 1.5px),
radial-gradient(circle at 39% 11%,#fff 0 1px,transparent 1.5px),
radial-gradient(circle at 56% 66%,#fff 0 1px,transparent 1.5px),
radial-gradient(circle at 73% 18%,#fff 0 1px,transparent 1.5px),
radial-gradient(circle at 88% 57%,#fff 0 1px,transparent 1.5px),
radial-gradient(circle at 94% 83%,#fff 0 1px,transparent 1.5px);
opacity:.45}
#hud{position:fixed;left:16px;top:16px;z-index:5;padding:12px 14px;
background:rgba(6,12,18,.86);border:1px solid #29404d;border-radius:11px;
backdrop-filter:blur(5px)}
#hud b{color:#78c8ef}.muted{color:#82909d;font-size:11px}
#info{margin-top:6px}
#scanStatus{margin-top:8px;line-height:1.5;color:#b7d5e5;font-size:12px}
#scanStatus small{display:block;color:#8a9eab}
.focus-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.focus-actions button{background:#102431;border:1px solid #31586d;border-radius:6px;color:#dcecf5;padding:5px 8px;cursor:pointer}
.focus-actions button[aria-pressed="true"]{border-color:#60d8c2;color:#60d8c2}
.panel-handle{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:grab;user-select:none;touch-action:none}
.panel-handle:active{cursor:grabbing}.panel-toggle{width:25px;height:25px;padding:0;border:1px solid #36566a;border-radius:6px;
background:#102431;color:#dcecf5;cursor:pointer;font-weight:800}.panel-collapsed{width:210px!important;height:42px!important;overflow:hidden!important}
.panel-collapsed .panel-body{display:none!important}.panel-collapsed .panel-handle{height:100%}.panel-dragging{box-shadow:0 18px 50px #000c!important}
#fsBtn{position:fixed;right:22px;bottom:22px;z-index:20;width:72px;height:72px;border:0;border-radius:50%;
background:#e11d2e;color:#fff;font-size:30px;font-weight:800;cursor:pointer;
box-shadow:0 0 0 5px rgba(225,29,46,.35),0 10px 28px rgba(0,0,0,.65);display:grid;place-items:center}
#fsBtn:hover{background:#ff2438;transform:scale(1.08)}#fsBtn:active{transform:scale(.96)}
#fsHint{position:fixed;right:22px;bottom:104px;z-index:20;padding:6px 10px;border-radius:8px;
background:rgba(0,0,0,.75);color:#f3c1c6;font-size:11px;opacity:0;transition:opacity .2s;pointer-events:none}
#fsBtn:hover+#fsHint{opacity:1}
#selected{position:fixed;right:16px;top:16px;z-index:5;width:290px;
padding:12px;background:rgba(6,12,18,.90);border:1px solid #29404d;border-radius:11px;display:none}
#presence{position:fixed;left:16px;bottom:16px;z-index:6;width:min(620px,calc(100vw - 32px));padding:12px 14px;
background:rgba(6,12,18,.92);border:1px solid #29404d;border-radius:14px;backdrop-filter:blur(8px)}
#presenceHead{display:flex;align-items:center;gap:12px}.avatar{width:58px;height:58px;border-radius:50%;display:grid;
place-items:center;font-size:25px;font-weight:700;background:radial-gradient(circle at 35% 25%,#fff4,transparent 28%),#173244;
border:2px solid var(--agent,#78c8ef);box-shadow:0 0 18px color-mix(in srgb,var(--agent) 55%,transparent)}
.avatar.speaking{animation:pulse .75s infinite alternate}.avatar.working,.avatar.thinking{animation:orbit 2s infinite linear}
@keyframes pulse{to{transform:scale(1.08);box-shadow:0 0 30px var(--agent)}}@keyframes orbit{to{filter:hue-rotate(360deg)}}
#presenceAgents{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
#presenceAgents button,.action{padding:7px 10px;color:#dcecf5;background:#102431;border:1px solid #31586d;border-radius:8px;cursor:pointer}
#presenceAgents button.active{border-color:var(--agent,#79d5ff);box-shadow:0 0 12px color-mix(in srgb,var(--agent) 55%,transparent)}
#taskBox{display:flex;gap:7px;margin-top:9px}#taskObjective{flex:1;min-width:0;padding:8px;color:#e8eef4;
background:#07121b;border:1px solid #29404d;border-radius:8px}#runtimeTask{margin-top:5px;color:#b8c8d4}
@media(max-width:700px){#selected{display:none!important}#presence{font-size:12px}.avatar{width:46px;height:46px}}
</style>
</head>
<body>
<div id="graph"></div>
<div id="stars"></div>
<button id="fsBtn" type="button" title="Fullscreen (Esc to exit)" aria-label="Enter fullscreen">⛶</button>
<div id="fsHint">Fullscreen · Esc to exit</div>

<div id="hud">
<div class="panel-handle" id="hudHandle"><b>BPFCo SUPER BRAIN · 3D</b><button class="panel-toggle" type="button" aria-label="Collapse Brain information">−</button></div>
<div class="panel-body">
  <div class="muted">Recorded links only · new edges pulse briefly</div>
  <div class="muted">Left-drag rotate · Right-drag pan · Wheel zoom</div>
  <div id="info">Loading brain…</div>
  <div id="scanStatus" role="status" aria-live="polite">Waiting for document scan…</div>
  <div class="focus-actions">
    <button id="focusAll" type="button" aria-pressed="true">Connected view</button>
    <button id="focusDocuments" type="button" aria-pressed="false">Documents</button>
  </div>
</div>
</div>

<div id="selected">
<div class="panel-handle" id="selectedHandle"><b id="selTitle">Node</b><button class="panel-toggle" type="button" aria-label="Collapse selected-node information">−</button></div>
<div class="panel-body">
  <div class="muted" id="selPath"></div>
  <div id="selStats"></div>
</div>
</div>

<div id="presence">
  <div class="panel-handle" id="presenceHandle"><b>AGENT PRESENCE</b><button class="panel-toggle" type="button" aria-label="Collapse agent presence">−</button></div>
  <div class="panel-body">
    <div id="presenceHead">
      <div class="avatar" id="presenceAvatar">F</div>
      <div>
        <b id="presenceName">Fred · CEO</b>
        <div class="muted" id="presenceState">CONNECTING · runtime</div>
        <div id="runtimeTask">Waiting for CEO runtime…</div>
      </div>
    </div>
    <div id="presenceAgents"></div>
    <div id="taskBox">
      <input id="taskObjective" placeholder="Give the selected specialist an internal task">
      <button class="action" id="dispatchButton">Assign</button>
      <button class="action" id="speakButton">Speak</button>
    </div>
  </div>
</div>

<script>
(async function(){

const agentRoles={Fred:"CEO",Bob:"Finance",Cindy:"Secretary",Kai:"Legal",Neo:"Sales"};
const runtimeNames={Bob:"Bob_Finance",Cindy:"Cindy_Secretary",Kai:"Kai_Legal",Neo:"Neo_Sales"};
const presenceAgents=document.getElementById("presenceAgents");
let activeFrame={agent:"Fred",role:"CEO",state:"READY",greeting:"Fred online."};

function setupFloatingPanel(panelId,handleId){
  const panel=document.getElementById(panelId);
  const handle=document.getElementById(handleId);
  const toggle=handle&&handle.querySelector(".panel-toggle");
  if(!panel||!handle||!toggle) return;
  const storageKey=`bpfco.brain3d.panel.${panelId}`;
  const clamp=()=>{
    const width=Math.min(panel.offsetWidth,innerWidth);
    const height=Math.min(panel.offsetHeight,innerHeight);
    panel.style.left=`${Math.max(0,Math.min(innerWidth-width,panel.offsetLeft))}px`;
    panel.style.top=`${Math.max(0,Math.min(innerHeight-height,panel.offsetTop))}px`;
    panel.style.right="auto";
    panel.style.bottom="auto";
  };
  const save=()=>localStorage.setItem(storageKey,JSON.stringify({
    left:panel.offsetLeft,top:panel.offsetTop,collapsed:panel.classList.contains("panel-collapsed")
  }));
  try{
    const saved=JSON.parse(localStorage.getItem(storageKey));
    if(saved){
      panel.style.left=`${saved.left}px`;panel.style.top=`${saved.top}px`;
      panel.style.right="auto";panel.style.bottom="auto";
      panel.classList.toggle("panel-collapsed",Boolean(saved.collapsed));
      toggle.textContent=saved.collapsed?"+":"−";
      clamp();
    }
  }catch(_){localStorage.removeItem(storageKey)}
  toggle.onclick=event=>{
    event.stopPropagation();
    panel.classList.toggle("panel-collapsed");
    const collapsed=panel.classList.contains("panel-collapsed");
    toggle.textContent=collapsed?"+":"−";
    toggle.setAttribute("aria-label",collapsed?"Restore panel":"Collapse panel");
    clamp();save();
  };
  let drag=null;
  handle.addEventListener("pointerdown",event=>{
    if(event.target.closest("button")) return;
    const box=panel.getBoundingClientRect();
    drag={x:event.clientX-box.left,y:event.clientY-box.top};
    panel.classList.add("panel-dragging");
    handle.setPointerCapture(event.pointerId);
  });
  handle.addEventListener("pointermove",event=>{
    if(!drag) return;
    panel.style.left=`${event.clientX-drag.x}px`;panel.style.top=`${event.clientY-drag.y}px`;
    panel.style.right="auto";panel.style.bottom="auto";clamp();
  });
  handle.addEventListener("pointerup",()=>{
    if(!drag) return;drag=null;panel.classList.remove("panel-dragging");save();
  });
  addEventListener("resize",clamp);
}

setupFloatingPanel("hud","hudHandle");
setupFloatingPanel("selected","selectedHandle");
setupFloatingPanel("presence","presenceHandle");

const fsBtn=document.getElementById("fsBtn");
const isFullscreen=()=>document.fullscreenElement||document.webkitFullscreenElement;
fsBtn.onclick=async()=>{
  try{
    if(isFullscreen()){
      if(document.exitFullscreen) await document.exitFullscreen();
      else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
    }else{
      const root=document.documentElement;
      if(root.requestFullscreen) await root.requestFullscreen();
      else if(root.webkitRequestFullscreen) root.webkitRequestFullscreen();
    }
  }catch(error){console.error("Fullscreen unavailable",error)}
};
const syncFullscreen=()=>{
  const active=Boolean(isFullscreen());
  fsBtn.textContent=active?"×":"⛶";
  fsBtn.setAttribute("aria-label",active?"Exit fullscreen":"Enter fullscreen");
};
document.addEventListener("fullscreenchange",syncFullscreen);
document.addEventListener("webkitfullscreenchange",syncFullscreen);

function speak(text){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const utterance=new SpeechSynthesisUtterance(text);
  utterance.rate=.95;
  speechSynthesis.speak(utterance);
}

async function setPresence(agent){
  await fetch("/api/presence",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({agent,state:"PRESENT",event:"call"})
  });
  await refreshPresence();
  speak(activeFrame.greeting||`${agent} online.`);
}

async function refreshPresence(){
  try{
    const response=await fetch("/api/presence/frame",{cache:"no-store"});
    const data=await response.json();
    const frame=data.frame||{};
    const runtime=data.runtime||{};
    activeFrame=frame;
    const avatar=document.getElementById("presenceAvatar");
    avatar.textContent=(frame.agent||"Fred").slice(0,1);
    avatar.style.setProperty("--agent",frame.color||"#78c8ef");
    avatar.className=`avatar ${(frame.state||"idle").toLowerCase()}`;
    document.getElementById("presence").style.setProperty("--agent",frame.color||"#78c8ef");
    document.getElementById("presenceName").textContent=
      `${frame.agent||"Fred"} · ${frame.role||"CEO"}`;
    document.getElementById("presenceState").textContent=
      `${frame.state||"IDLE"} · RUNTIME ${runtime.connected?"CONNECTED":"OFFLINE"} · ${frame.expression||"neutral"}`;
    const task=runtime.task;
    document.getElementById("runtimeTask").textContent=task?.objective
      ? `Current task: ${task.objective}`
      : `${frame.personality||"Agent ready"}.`;
    [...presenceAgents.children].forEach(button=>
      button.classList.toggle("active",button.dataset.agent===frame.agent));
  }catch(error){
    document.getElementById("presenceState").textContent="Presence unavailable";
  }
}

Object.entries(agentRoles).forEach(([agent,role])=>{
  const button=document.createElement("button");
  button.dataset.agent=agent;
  button.textContent=agent;
  button.title=`Call ${agent} · ${role}`;
  button.onclick=()=>setPresence(agent);
  presenceAgents.appendChild(button);
});
document.getElementById("speakButton").onclick=()=>
  speak(`${activeFrame.agent}. ${activeFrame.role}. ${activeFrame.state}. ${document.getElementById("runtimeTask").textContent}`);
document.getElementById("dispatchButton").onclick=async()=>{
  const agent=activeFrame.agent;
  const objective=document.getElementById("taskObjective").value.trim();
  if(agent==="Fred"){document.getElementById("runtimeTask").textContent="Fred coordinates specialists; select Bob, Cindy, Kai or Neo.";return}
  if(!objective) return;
  const response=await fetch("/api/dispatch",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({agent:runtimeNames[agent],objective,priority:"normal"})});
  const result=await response.json();
  document.getElementById("runtimeTask").textContent=result.ok?`Queued: ${objective}`:(result.error||"Dispatch failed");
  if(result.ok){document.getElementById("taskObjective").value="";speak(`${agent}, your task is queued.`)}
  await refreshPresence();
};
await refreshPresence();
setInterval(refreshPresence,3000);

const endpoint=value=>String(value&&typeof value==="object"?value.id:value);
const info=document.getElementById("info");
const scanStatus=document.getElementById("scanStatus");
let brain={nodes:[],links:[],stats:{}};
let chosen=[],links=[],degrees=new Map(),signature="",activeFilter="",refreshing=false;
let freshEdges=new Set(),freshTimer=null;
const edgeKey=l=>`${endpoint(l.source)}>${endpoint(l.target)}:${l.relationship||""}:${Boolean(l.unresolved)}`;
const score=n=>degrees.get(String(n.id))||0;
const setInfo=(nodes,visibleLinks,filter="")=>{
  info.textContent=`${nodes.length}/${brain.nodes.length} nodes shown · ${visibleLinks.length}/${brain.links.length} recorded links${filter?` · ${filter}`:""}`;
};
function updateScanStatus(stats){
  if(stats.document_sources===undefined){
    scanStatus.textContent="Document source unavailable in this graph response";
    return;
  }
  const pending=Number(stats.document_pending||0);
  const total=Number(stats.document_sources||0);
  const checked=Math.max(0,total-pending);
  const changed=Number(stats.source_changed_during_scan||0);
  const hashPending=Number(stats.document_unverified_hashes||0);
  scanStatus.replaceChildren();
  const summary=document.createElement("div");
  summary.textContent=`${stats.notes||0} notes · ${total} supported documents · ${checked}/${total} source checks · ${stats.document_links||0} explicit document references`;
  scanStatus.appendChild(summary);
  const detail=document.createElement("small");
  detail.textContent=`${stats.exact_duplicate_groups||0} exact-copy groups · ${stats.document_duplicates_suppressed||0} copies represented by aliases · ${pending} pending`;
  scanStatus.appendChild(detail);
  const folders=document.createElement("small");
  folders.textContent=`${stats.document_folder_nodes||0} real folders · ${stats.document_folder_links||0} file-location links (not content matches)`;
  scanStatus.appendChild(folders);
  const snapshot=document.createElement("small");
  snapshot.textContent=stats.source_snapshot
    ? `Source scan: ${stats.source_files_seen||0} files · snapshot ${stats.source_snapshot}${changed||hashPending?` · ${changed} changed, ${hashPending} hashes pending`:""}`
    : "Source snapshot not checked in this preview";
  scanStatus.appendChild(snapshot);
  const meaning=document.createElement("small");
  meaning.textContent=stats.document_links
    ? "Links require explicit document references or task sources; new edges pulse when found"
    : "Document nodes are sources; no document connections have been verified yet";
  scanStatus.appendChild(meaning);
  const comparison=document.createElement("small");
  comparison.textContent="Duplicate counts describe this scan; earlier inventory comparison is unresolved";
  scanStatus.appendChild(comparison);
  if(stats.source_scan_incomplete||changed||hashPending){
    const warning=document.createElement("small");
    warning.textContent="Source scan incomplete or changing; duplicate counts are provisional";
    scanStatus.appendChild(warning);
  }
}

const elem=document.getElementById("graph");
elem.addEventListener("contextmenu",event=>event.preventDefault());

const Graph=new ForceGraph3D(elem,{
  controlType:"orbit",
  backgroundColor:"#02050a",
  showNavInfo:false
})
.graphData({nodes:[],links:[]})
.nodeLabel(n=>
  `${String(n.label||n.id).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[char]))}<br>`+
  `${String(n.folder||"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[char]))}<br>`+
  `links: ${score(n)}`
)
.nodeAutoColorBy(n=>n.folder||"BPFCo")
.nodeVal(n=>Math.max(1,Math.log2(score(n)+2)))
.linkDirectionalParticles(link=>freshEdges.has(edgeKey(link))?2:0)
.linkDirectionalParticleColor(link=>link.relationship?.startsWith("experience")?"#f7b267":link.relationship?.includes("source")||link.relationship?.includes("evidence")?"#68e0c1":"#73aaff")
.linkDirectionalParticleWidth(.8)
.linkOpacity(.35)
.linkColor(link=>link.unresolved?"#e36666":link.relationship?.startsWith("experience")?"#f7b267":"#4baac0")
.onNodeClick(node=>{
  document.getElementById("selected").style.display="block";
  document.getElementById("selTitle").textContent=node.label||node.id;
  document.getElementById("selPath").textContent=node.path||node.folder||"";
  document.getElementById("selStats").textContent=
    `Words: ${node.word_count||0} · Connections: ${score(node)}${node.duplicate_count>1?` · ${node.duplicate_count} identical source files`:""} · `+
    Object.entries(brain.links.filter(link=>endpoint(link.source)===String(node.id)||endpoint(link.target)===String(node.id))
      .reduce((counts,link)=>{const kind=link.relationship||"note link";counts[kind]=(counts[kind]||0)+1;return counts},{}))
      .map(([kind,count])=>`${kind}: ${count}`).join(" · ");

  Graph.cameraPosition(
    {x:node.x+40,y:node.y+40,z:node.z+40},
    node,
    1200
  );
});

const resizeGraph=()=>{
  const width=elem.clientWidth||innerWidth;
  const height=elem.clientHeight||innerHeight;
  Graph.width(width).height(height);
};
addEventListener("resize",resizeGraph);
document.addEventListener("fullscreenchange",()=>requestAnimationFrame(resizeGraph));
document.addEventListener("webkitfullscreenchange",()=>requestAnimationFrame(resizeGraph));
resizeGraph();

const filterGraph=value=>{
  activeFilter=String(value||"");
  const query=String(value||"").trim().toLowerCase();
  if(!query){
    Graph.graphData({nodes:chosen,links});
    setInfo(chosen,links);
    return;
  }
  const matches=brain.nodes.filter(node=>
    [node.label,node.folder,node.path,node.id].some(field=>String(field||"").toLowerCase().includes(query))
  ).slice(0,250);
  const matchedIds=new Set(matches.map(node=>String(node.id)));
  const neighbors=new Set();
  brain.links.forEach(link=>{
    const source=endpoint(link.source),target=endpoint(link.target);
    if(matchedIds.has(source)) neighbors.add(target);
    if(matchedIds.has(target)) neighbors.add(source);
  });
  const nodes=matches.concat(brain.nodes.filter(node=>
    neighbors.has(String(node.id))&&!matchedIds.has(String(node.id))).slice(0,350-matches.length));
  const ids=new Set(nodes.map(node=>String(node.id)));
  const visibleLinks=brain.links.filter(link=>{
    const source=typeof link.source==="object"?link.source.id:link.source;
    const target=typeof link.target==="object"?link.target.id:link.target;
    return ids.has(String(source))&&ids.has(String(target));
  });
  Graph.graphData({nodes,links:visibleLinks.map(link=>({...link,source:endpoint(link.source),target:endpoint(link.target)}))});
  setInfo(nodes,visibleLinks,value);
  if(nodes.length) setTimeout(()=>Graph.zoomToFit(500,30),50);
};
function setFocus(value){
  filterGraph(value);
  document.getElementById("focusAll").setAttribute("aria-pressed",String(!value));
  document.getElementById("focusDocuments").setAttribute("aria-pressed",String(Boolean(value)));
}
document.getElementById("focusAll").onclick=()=>setFocus("");
document.getElementById("focusDocuments").onclick=()=>setFocus("Documents /");

async function refreshGraph(){
  if(refreshing||document.hidden) return;
  refreshing=true;
  try{
    const response=await fetch("/api/brain-graph",{cache:"no-store"});
    if(!response.ok) throw Error(`Graph HTTP ${response.status}`);
    const next=await response.json();
    if(!Array.isArray(next.nodes)||!Array.isArray(next.links)) throw Error("Invalid graph");
    updateScanStatus(next.stats||{});
    const nextSignature=next.nodes.map(n=>String(n.id)).sort().join("\n")+"|"+
      next.links.map(edgeKey).sort().join("\n");
    if(nextSignature===signature){
      brain.stats=next.stats||{};
      setInfo(Graph.graphData().nodes,Graph.graphData().links,activeFilter);
      return;
    }
    const previous=new Set(brain.links.map(edgeKey));
    freshEdges=new Set(signature?next.links.map(edgeKey).filter(key=>!previous.has(key)):[]);
    clearTimeout(freshTimer);
    freshTimer=setTimeout(()=>{freshEdges.clear();Graph.linkDirectionalParticles(link=>0)},8000);
    signature=nextSignature;brain=next;
    degrees=new Map();
    next.links.forEach(link=>{
      const source=endpoint(link.source),target=endpoint(link.target);
      degrees.set(source,(degrees.get(source)||0)+1);
      degrees.set(target,(degrees.get(target)||0)+1);
    });
    const positions=new Map(Graph.graphData().nodes.map(n=>[String(n.id),n]));
    chosen=[...next.nodes].sort((a,b)=>score(b)-score(a)||String(a.id).localeCompare(String(b.id)))
      .slice(0,350).map(n=>{
        const old=positions.get(String(n.id));
        return old?{...n,x:old.x,y:old.y,z:old.z,vx:old.vx,vy:old.vy,vz:old.vz}:n;
      });
    const ids=new Set(chosen.map(n=>String(n.id)));
    links=next.links.filter(l=>ids.has(endpoint(l.source))&&ids.has(endpoint(l.target)))
      .map(l=>({...l,source:endpoint(l.source),target:endpoint(l.target)}));
    filterGraph(activeFilter);
    Graph.linkDirectionalParticles(link=>freshEdges.has(edgeKey(link))?2:0);
    window.bpfcoBrain3D.domains=[...new Set(chosen.map(n=>n.folder).filter(Boolean))].sort();
  }catch(error){info.textContent=`Graph refresh unavailable: ${error.message}`}
  finally{refreshing=false}
}
window.bpfcoBrain3D={domains:[],filter:filterGraph,reset:()=>filterGraph(""),graph:Graph,refresh:refreshGraph};
await refreshGraph();
setInterval(refreshGraph,15000);

})();
</script>
</body>
</html>
