<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>🧠 BPFCoBrain Dashboard</title>
    <link rel="icon" href="brain-icon.ico">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 300px 1fr 300px;
            gap: 20px;
            height: 90vh;
        }

        /* Left Sidebar - Info Panel */
        .sidebar {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .sidebar h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #667eea;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .stat-box {
            background: #f5f7fa;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .search-box {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            margin-top: 15px;
            margin-bottom: 10px;
        }

        .search-box:focus {
            outline: none;
            border-color: #667eea;
        }

        .top-concepts {
            margin-top: 15px;
        }

        .concept-tag {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            margin: 4px 4px 4px 0;
            cursor: pointer;
            transition: all 0.3s;
        }

        .concept-tag:hover {
            background: #764ba2;
            transform: scale(1.05);
        }

        /* Center - Graph Visualization */
        .graph-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            position: relative;
        }

        #graph {
            width: 100%;
            height: 100%;
        }

        .graph-info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 12px;
            color: #666;
            pointer-events: none;
        }

        /* Right Sidebar - Details Panel */
        .details-panel {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .details-panel h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #667eea;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .detail-item {
            margin-bottom: 12px;
            padding: 10px;
            background: #f5f7fa;
            border-radius: 6px;
        }

        .detail-label {
            font-size: 11px;
            color: #999;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .detail-value {
            font-size: 14px;
            color: #333;
            word-break: break-all;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .container {
                grid-template-columns: 1fr;
                height: auto;
            }

            .sidebar,
            .details-panel {
                max-height: 300px;
            }
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }

        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Left Sidebar -->
        <div class="sidebar">
            <h2>🧠 Brain Stats</h2>
            
            <div class="stat-box">
                <div class="stat-label">Total Notes</div>
                <div class="stat-value" id="noteCount">—</div>
            </div>

            <div class="stat-box">
                <div class="stat-label">Total Words</div>
                <div class="stat-value" id="wordCount">—</div>
            </div>

            <div class="stat-box">
                <div class="stat-label">Connections</div>
                <div class="stat-value" id="connCount">—</div>
            </div>

            <div class="stat-box">
                <div class="stat-label">Files</div>
                <div class="stat-value" id="fileCount">—</div>
            </div>

            <div class="stat-box">
                <div class="stat-label">Token Pool</div>
                <div class="stat-value" id="tokenPool">Not configured</div>
            </div>

            <input type="text" class="search-box" placeholder="Search concepts..." id="searchInput">
            
            <div class="top-concepts">
                <strong style="font-size: 12px; color: #666; text-transform: uppercase;">Top Concepts</strong>
                <div style="margin-top: 8px;" id="topConcepts">Loading...</div>
            </div>

            <div style="margin-top: auto; padding-top: 15px; border-top: 1px solid #e0e0e0;">
                <button class="btn-primary" onclick="exportData()" style="width: 100%; margin-bottom: 8px;">
                    📥 Export
                </button>
                <button class="btn-secondary" onclick="refreshGraph()" style="width: 100%;">
                    🔄 Refresh
                </button>
            </div>
        </div>

        <!-- Center - Graph -->
        <div class="graph-container">
            <div class="graph-info">
                📊 Brain Knowledge Graph | Drag to move • Scroll to zoom • Click to details
            </div>
            <div id="graph"></div>
        </div>

        <!-- Right Sidebar - Details -->
        <div class="details-panel">
            <h2>ℹ️ Details</h2>
            
            <div id="detailsContent" class="empty-state">
                <div>
                    <div style="font-size: 48px; margin-bottom: 10px;">👈</div>
                    <div>Click a node in the graph to see details</div>
                </div>
            </div>

            <div class="btn-group" style="margin-top: auto;">
                <button class="btn-primary" onclick="copyToClipboard()">📋 Copy</button>
                <button class="btn-secondary" onclick="closeDetails()">✕ Close</button>
            </div>
        </div>
    </div>

    <script>
        const INDEX_URL = ".vault-index.json";
        let brainIndex = null;
        let graphData = { nodes: [], links: [] };
        let currentNode = null;
        let simulation = null;

        const escapeHtml = value => String(value ?? "")
            .replace(/&/g, "&amp;").replace(/</g, "&lt;")
            .replace(/>/g, "&gt;").replace(/\"/g, "&quot;");

        function setStatus(message, isError = false) {
            document.querySelector(".graph-info").textContent = message;
            document.querySelector(".graph-info").style.color = isError ? "#b42318" : "#666";
        }

        function normalizeIndex(index) {
            const notes = index.notes && !Array.isArray(index.notes) ? index.notes : {};
            const nodes = Object.entries(notes).map(([id, note]) => ({
                id, title: note.title || id, path: note.path || "", folder: note.folder || "",
                word_count: note.word_count || 0, content: note.content || "",
                links: Array.isArray(note.links) ? note.links : [], frontmatter: note.frontmatter || {}
            }));
            const known = new Set(nodes.map(node => node.id.toLowerCase()));
            const links = [];
            const seen = new Set();
            const external = new Map();
            nodes.forEach(node => {
                const indexedLinks = index.graph?.[node.id];
                const targets = Array.isArray(indexedLinks) && indexedLinks.length ? indexedLinks : node.links;
                (targets || []).forEach(target => {
                const match = nodes.find(candidate => candidate.id.toLowerCase() === String(target).toLowerCase());
                const targetId = match ? match.id : `external:${target}`;
                if (!match) external.set(targetId, { id: targetId, title: `[unresolved] ${target}`, path: "", folder: "unresolved", links: [], unresolved: true });
                const key = [node.id, targetId].sort().join("\0");
                if (!seen.has(key)) { seen.add(key); links.push({ source: node.id, target: targetId, strength: 1, unresolved: !match }); }
                });
            });
            nodes.push(...external.values());
            return { nodes, links };
        }

        function updateStats(index, data) {
            const stats = index.stats || {};
            const words = stats.total_words ?? (index.notes && Object.values(index.notes).reduce((sum, n) => sum + (n.word_count || 0), 0));
            document.getElementById("noteCount").textContent = (stats.total_notes ?? index.note_count ?? data.nodes.length).toLocaleString();
            document.getElementById("wordCount").textContent = Number(words || 0).toLocaleString();
            const verified = stats.connections ?? data.links.filter(link => !link.unresolved).length;
            const unresolved = stats.unresolved_links ?? data.links.filter(link => link.unresolved).length;
            document.getElementById("connCount").textContent = `${verified.toLocaleString()} verified / ${unresolved.toLocaleString()} unresolved`;
            const types = {};
            data.nodes.forEach(node => { const ext = (node.path.match(/\.([^.\\/]+)$/) || ["", "note"])[1].toLowerCase(); types[ext] = (types[ext] || 0) + 1; });
            document.getElementById("fileCount").innerHTML = Object.entries(types).sort((a, b) => b[1] - a[1]).slice(0, 4).map(([type, count]) => `${count.toLocaleString()} ${escapeHtml(type)}`).join("<br>") || "No files";
            const folders = {};
            data.nodes.forEach(node => { if (node.folder) folders[node.folder] = (folders[node.folder] || 0) + 1; });
            document.getElementById("topConcepts").innerHTML = Object.entries(folders).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([folder, count]) => `<span class="concept-tag">${escapeHtml(folder)} (${count})</span>`).join("") || "No folders";
        }

        function renderGraph(data) {
            const container = document.getElementById("graph");
            container.innerHTML = "";
            const width = container.clientWidth || 800, height = container.clientHeight || 600;
            const svg = d3.select(container).append("svg").attr("width", width).attr("height", height);
            const links = svg.append("g").selectAll("line").data(data.links).enter().append("line")
                .attr("stroke", "#c7cbd6").attr("stroke-width", 1.5);
            const nodes = svg.append("g").selectAll("circle").data(data.nodes).enter().append("circle")
                .attr("r", d => Math.max(5, Math.min(16, 5 + Math.sqrt(d.links.length + 1))))
                .attr("fill", d => d.unresolved ? "#f59e0b" : "#667eea").attr("stroke", "white").attr("stroke-width", 1.5)
                .style("cursor", "pointer").on("click", showDetails);
            const labels = svg.append("g").selectAll("text").data(data.nodes).enter().append("text")
                .attr("text-anchor", "middle").attr("dy", "-9").attr("fill", "#333")
                .attr("font-size", "10px").text(d => d.title.length > 24 ? `${d.title.slice(0, 21)}...` : d.title);
            simulation = d3.forceSimulation(data.nodes)
                .force("link", d3.forceLink(data.links).id(d => d.id).distance(70))
                .force("charge", d3.forceManyBody().strength(-45)).force("center", d3.forceCenter(width / 2, height / 2))
                .on("tick", () => {
                    links.attr("x1", d => d.source.x).attr("y1", d => d.source.y).attr("x2", d => d.target.x).attr("y2", d => d.target.y);
                    nodes.attr("cx", d => d.x).attr("cy", d => d.y); labels.attr("x", d => d.x).attr("y", d => d.y);
                });
            nodes.call(d3.drag().on("start", (event, d) => { if (!event.active) simulation.alphaTarget(.3).restart(); d.fx = d.x; d.fy = d.y; })
                .on("drag", (event, d) => { d.fx = event.x; d.fy = event.y; })
                .on("end", (event, d) => { if (!event.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }));
        }

        function showDetails(event, node) {
            currentNode = node;
            const connected = graphData.links.filter(link => link.source.id === node.id || link.target.id === node.id)
                .map(link => link.source.id === node.id ? link.target.id : link.source.id);
            document.getElementById("detailsContent").innerHTML = `<div class="detail-item"><div class="detail-label">Note</div><div class="detail-value">${escapeHtml(node.title)}</div></div><div class="detail-item"><div class="detail-label">Path</div><div class="detail-value">${escapeHtml(node.path)}</div></div><div class="detail-item"><div class="detail-label">Words / Connections</div><div class="detail-value">${node.word_count.toLocaleString()} / ${connected.length}</div></div><div class="detail-item"><div class="detail-label">Connected To</div><div class="detail-value">${escapeHtml(connected.join(", ") || "No explicit links")}</div></div>`;
        }

        function closeDetails() { currentNode = null; document.getElementById("detailsContent").innerHTML = `<div class="empty-state"><div>Click a node to see details</div></div>`; }
        function copyToClipboard() { if (currentNode) navigator.clipboard.writeText(`${currentNode.title}\n${currentNode.path}`).then(() => alert("Copied to clipboard!")); }
        function exportData() { const blob = new Blob([JSON.stringify(brainIndex, null, 2)], { type: "application/json" }); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "brain-index.json"; a.click(); URL.revokeObjectURL(a.href); }
        function refreshGraph() { loadIndex(); }
        function searchGraph(event) { const query = event.target.value.trim().toLowerCase(); d3.selectAll("#graph circle").attr("opacity", d => !query || `${d.title} ${d.path} ${d.content}`.toLowerCase().includes(query) ? 1 : .15); }

        async function loadIndex() {
            try {
                setStatus("Loading live vault index...");
                const response = await fetch(`${INDEX_URL}?t=${Date.now()}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                brainIndex = await response.json(); graphData = normalizeIndex(brainIndex); updateStats(brainIndex, graphData); renderGraph(graphData);
                setStatus(`Live vault index | ${graphData.nodes.length.toLocaleString()} notes • ${graphData.links.length.toLocaleString()} links`);
            } catch (error) {
                setStatus(`Unable to load ${INDEX_URL}. Open this folder through a local web server, not file:// (${error.message})`, true);
                document.getElementById("graph").innerHTML = `<div class="empty-state">The live index could not be loaded.<br><small>Run <code>python -m http.server</code> in the vault folder, then open http://localhost:8000/dashboard.html.</small></div>`;
            }
        }

        document.getElementById("searchInput").addEventListener("input", searchGraph);
        window.addEventListener("resize", () => { if (brainIndex) renderGraph(graphData); });
        window.addEventListener("load", loadIndex);
    </script>
</body>
</html>
