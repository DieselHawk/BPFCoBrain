<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>BPFCo Brain Graph</title>
<script src="/vendor/d3.v7.min.js"></script>
<style>
  html,body{margin:0;height:100%;background:#0a1016;color:#dce6ed;font:13px Segoe UI,Arial;overflow:hidden}
  #wrap{position:relative;width:100%;height:100%}
  #bar{position:absolute;left:0;right:0;top:0;z-index:5;padding:10px 12px;border-bottom:1px solid #24303a;
       display:flex;gap:12px;align-items:center;background:rgba(10,16,22,.92);backdrop-filter:blur(6px)}
  #status{color:#82909d}
  #svg{width:100%;height:100%;display:block;background:#0a1016}

  /* Big red fullscreen control */
  #svg{position:relative;z-index:1}
  #bar{z-index:5}
  #fsBtn{
    position:fixed !important;
    right:22px !important;
    bottom:22px !important;
    z-index:2147483647 !important;
    width:72px;height:72px;border:0;border-radius:50%;
    background:#e11d2e;color:#fff;font-size:30px;font-weight:800;
    cursor:pointer;box-shadow:0 0 0 5px rgba(225,29,46,.35),0 10px 28px rgba(0,0,0,.65);
    display:grid;place-items:center;line-height:1;
    pointer-events:auto !important;
  }
  #fsBtn:hover{background:#ff2438;transform:scale(1.08)}
  #fsBtn:active{transform:scale(0.96)}
  #fsHint{
    position:fixed !important;
    right:22px !important;
    bottom:104px !important;
    z-index:2147483647 !important;
    padding:6px 10px;border-radius:8px;background:rgba(0,0,0,.75);
    color:#f3c1c6;font-size:11px;opacity:0;transition:opacity .2s;pointer-events:none
  }
  #fsBtn:hover + #fsHint{opacity:1}
  #wrap:fullscreen,#wrap:-webkit-full-screen{width:100vw;height:100vh;background:#0a1016}
  #wrap:fullscreen #fsBtn{background:#b9101f}
</style>
</head>
<body>
<div id="wrap">
  <div id="bar">
    <b>BPFCo Brain Graph</b>
    <span id="status">Loading…</span>
  </div>
  <svg id="svg"></svg>
  <button id="fsBtn" style="position:fixed;right:22px;bottom:22px;z-index:2147483647" type="button" title="Fullscreen (Esc to exit)" aria-label="Fullscreen">⛶</button>
  <div id="fsHint">Fullscreen · Esc to exit</div>
</div>
<script>
(function () {
  const wrap = document.getElementById("wrap");
  const fsBtn = document.getElementById("fsBtn");

  function isFs() {
    return document.fullscreenElement || document.webkitFullscreenElement;
  }

  async function toggleFs() {
    try {
      if (isFs()) {
        if (document.exitFullscreen) await document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      } else {
        if (wrap.requestFullscreen) await wrap.requestFullscreen();
        else if (wrap.webkitRequestFullscreen) wrap.webkitRequestFullscreen();
      }
    } catch (e) {
      console.error(e);
      alert("Fullscreen blocked: " + e.message);
    }
  }

  function syncFsUi() {
    fsBtn.textContent = isFs() ? "✕" : "⛶";
    fsBtn.title = isFs() ? "Exit fullscreen (Esc)" : "Fullscreen (Esc to exit)";
  }

  fsBtn.addEventListener("click", toggleFs);
  document.addEventListener("fullscreenchange", syncFsUi);
  document.addEventListener("webkitfullscreenchange", syncFsUi);

  // Esc exits fullscreen natively; also allow Esc when not fs to do nothing harmful
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && isFs()) {
      // browser exits fs; sync on fullscreenchange
    }
  });

  // If embedded in /super iframe, parent must allow fullscreen
  try {
    if (window.frameElement && !window.frameElement.hasAttribute("allowfullscreen")) {
      window.frameElement.setAttribute("allowfullscreen", "");
      window.frameElement.setAttribute("allow", "fullscreen");
    }
  } catch (_) {}
})();

(async function () {
  const status = document.getElementById("status");
  const svgEl = document.getElementById("svg");
  try {
    if (typeof d3 === "undefined") throw new Error("D3 not loaded");
    const brain = await fetch("/api/brain-graph", { cache: "no-store" }).then(r => {
      if (!r.ok) throw new Error("API " + r.status);
      return r.json();
    });

    let nodes = (brain.nodes || []).map(n => ({
      id: String(n.id),
      label: n.label || n.title || String(n.id),
      folder: n.folder || "",
      connection_count: +n.connection_count || 0
    }));
    nodes.sort((a,b) => b.connection_count - a.connection_count);
    nodes = nodes.slice(0, 200);

    const ids = new Set(nodes.map(n => n.id));
    let links = (brain.links || [])
      .map(l => ({ source: String(l.source), target: String(l.target) }))
      .filter(l => ids.has(l.source) && ids.has(l.target));

    if (links.length < 5 && nodes.length > 1) {
      const byFolder = d3.group(nodes, d => d.folder || "root");
      const extra = [];
      for (const [, group] of byFolder) {
        for (let i = 1; i < group.length && i < 8; i++) {
          extra.push({ source: group[0].id, target: group[i].id });
        }
      }
      links = links.concat(extra).slice(0, 400);
      status.textContent = nodes.length + " nodes · " + links.length + " links (folder fallback)";
    } else {
      status.textContent = nodes.length + " nodes · " + links.length + " links";
    }

    function size() {
      const w = svgEl.clientWidth || window.innerWidth;
      const h = svgEl.clientHeight || window.innerHeight;
      return { w, h };
    }

    let { w, h } = size();
    const svg = d3.select(svgEl).attr("viewBox", [0, 0, w, h]);
    const g = svg.append("g");
    svg.call(d3.zoom().scaleExtent([0.15, 5]).on("zoom", e => g.attr("transform", e.transform)));

    const color = d3.scaleOrdinal(d3.schemeTableau10);
    const sim = d3.forceSimulation(nodes)
      .force("link", d3.forceLink(links).id(d => d.id).distance(45).strength(0.35))
      .force("charge", d3.forceManyBody().strength(-90))
      .force("center", d3.forceCenter(w/2, h/2))
      .force("collide", d3.forceCollide(14));

    const link = g.append("g").attr("stroke", "#3d5563").attr("stroke-opacity", 0.55)
      .selectAll("line").data(links).join("line");

    const node = g.append("g").selectAll("g").data(nodes).join("g")
      .call(d3.drag()
        .on("start", (e,d) => { if (!e.active) sim.alphaTarget(0.25).restart(); d.fx=d.x; d.fy=d.y; })
        .on("drag", (e,d) => { d.fx=e.x; d.fy=e.y; })
        .on("end", (e,d) => { if (!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }));

    node.append("circle")
      .attr("r", d => 5 + Math.min(10, Math.sqrt(d.connection_count + 1)))
      .attr("fill", d => color(d.folder || "x"))
      .attr("stroke", "#0a1016").attr("stroke-width", 1)
      .append("title").text(d => d.label + "\n" + d.folder);

    node.append("text").text(d => d.label.length > 18 ? d.label.slice(0,16)+"…" : d.label)
      .attr("x", 9).attr("y", 3).attr("fill", "#c9d6df").attr("font-size", 10);

    sim.on("tick", () => {
      link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
          .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
      node.attr("transform", d => "translate("+d.x+","+d.y+")");
    });

    // Keep layout usable after entering/exiting fullscreen
    function onResize() {
      const s = size();
      svg.attr("viewBox", [0, 0, s.w, s.h]);
      sim.force("center", d3.forceCenter(s.w/2, s.h/2));
      sim.alpha(0.2).restart();
    }
    window.addEventListener("resize", onResize);
    document.addEventListener("fullscreenchange", onResize);
  } catch (e) {
    status.textContent = "FAILED: " + e.message;
    console.error(e);
  }
})();
</script>
</body>
</html>
